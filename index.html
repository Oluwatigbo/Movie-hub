<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie & TV Show Recommendation Hub</title>
  <meta name="description" content="Discover and recommend movies and TV shows with personalized suggestions, trailers, and watchlists.">
  <meta property="og:title" content="Movie Hub">
  <meta property="og:description" content="Your personalized movie and TV discovery app.">
  <meta property="og:image" content="https://image.tmdb.org/t/p/w500/placeholder.jpg"> <!-- Replace with actual -->
  <meta name="theme-color" content="#FF6B6B">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>"> <!-- Simple icon fallback -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header -->
  <header class="bg-dark text-white p-3" role="banner">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center">
        <h1 class="h4 mb-0 fw-bold">Movie Hub</h1>
        <div class="d-flex align-items-center gap-3">
          <input type="search" id="searchInput" class="form-control form-control-sm" placeholder="Search movies/TV..." aria-label="Search movies or TV shows" maxlength="100">
          <button id="darkModeToggle" class="btn btn-outline-light btn-sm" aria-label="Toggle dark mode">🌙</button>
          <a href="#watchlist" class="btn btn-outline-light btn-sm">Watchlist</a>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content (Dynamic) -->
  <main id="mainContent" class="container my-4" role="main" aria-live="polite">
    <!-- Homepage: Genre Browse & Trending (Static base, dynamic content) -->
    <section id="home" class="row" hidden>
      <div class="col-12">
        <h2 class="h3 mb-3">Browse by Genre</h2>
        <div id="genreButtons" class="d-flex flex-wrap gap-2 mb-4 overflow-auto"></div>
      </div>
      <div class="col-12">
        <h2 class="h3 mb-3">Trending Now</h2>
        <div id="trendingGrid" class="row g-3"></div>
      </div>
    </section>

    <!-- Search Results -->
    <section id="searchResults" class="row" hidden>
      <div class="col-12">
        <h2 id="searchTitle" class="h3 mb-3"></h2>
        <div id="resultsGrid" class="row g-3"></div>
      </div>
    </section>

    <!-- Details Modal (Dynamic) -->
    <div id="detailsModal" class="modal fade" tabindex="-1" aria-hidden="true" role="dialog">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 id="modalTitle" class="modal-title"></h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div id="modalContent"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Watchlist -->
    <section id="watchlist" class="row" hidden>
      <div class="col-12">
        <h2 class="h3 mb-3">My Watchlist</h2>
        <div id="watchlistGrid" class="row g-3"></div>
        <button id="exportWatchlist" class="btn btn-primary mt-3">Export Watchlist</button>
      </div>
    </section>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="text-center py-5" hidden>
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- Error State -->
    <section id="errorSection" class="row justify-content-center" hidden>
      <div class="col-md-6 text-center">
        <h2 class="h3 mb-3">Oops! Something went wrong.</h2>
        <p id="errorMessage"></p>
        <button id="retryButton" class="btn btn-primary">Retry</button>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="bg-light text-center py-3 mt-5" role="contentinfo">
    <p class="mb-0">&copy; 2024 Movie Hub. Built with ❤️ for web dev course.</p>
  </footer>

  <!-- Bootstrap JS (for modals only; no other JS reliance) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <!-- App JS -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
