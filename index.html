<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Hub - Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
</head>
<body>
  <!-- Header -->
  <header class="bg-dark text-white p-3">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center">
        <h1 class="h3 mb-0">🎬 Movie Hub</h1>
        <nav class="d-flex gap-2">
          <a href="#home" class="btn btn-outline-light btn-sm">Home</a>
          <a href="#watchlist" class="btn btn-outline-light btn-sm">Watchlist</a>
          <button id="darkModeToggle" class="btn btn-outline-light btn-sm" aria-label="Switch to dark mode">🌙</button>
        </nav>
      </div>
      <div class="mt-2">
        <div class="input-group">
          <input type="search" id="searchInput" class="form-control" placeholder="Search movies or TV shows..." aria-label="Search">
          <button class="btn btn-outline-light" type="button" disabled>Search</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main id="mainContent">
    <!-- Home Section -->
    <section id="home" class="container my-4 hidden">
      <div class="row">
        <div class="col-md-3">
          <h2 class="h4">Genres</h2>
          <div id="genreButtons" class="d-flex flex-wrap gap-2 mb-4"></div>
        </div>
        <div class="col-md-9">
          <h2 class="h4">Trending Now</h2>
          <div id="trendingGrid" class="row g-3"></div>
        </div>
      </div>
    </section>

    <!-- Search Results Section -->
    <section id="searchResults" class="container my-4 hidden">
      <h2 class="h4">Search Results</h2>
      <div id="resultsGrid" class="row g-3"></div>
    </section>

    <!-- Watchlist Section -->
    <section id="watchlist" class="container my-4 hidden">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h4 mb-0">Watchlist</h2>
        <button id="exportWatchlist" class="btn btn-primary btn-sm">Export</button>
      </div>
      <div id="watchlistGrid" class="row g-3"></div>
    </section>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="d-none text-center my-4">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="mt-2">Loading content...</p>
    </div>

    <!-- Error Section -->
    <section id="errorSection" class="container my-4 hidden">
      <div class="alert alert-danger" role="alert">
        <h4 class="alert-heading">Something went wrong!</h4>
        <p id="errorMessage">An error occurred. Please try again.</p>
        <button id="retryButton" class="btn btn-warning">Retry</button>
      </div>
    </section>
  </main>

  <!-- Details Modal -->
  <div class="modal fade" id="detailsModal" tabindex="-1" aria-labelledby="detailsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="detailsModalLabel">Movie Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="modalBody">
          <!-- Dynamic content loaded here -->
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- App JS -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
