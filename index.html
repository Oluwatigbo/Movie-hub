<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Hub - Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="/favicon.png" sizes="16x16">
  <meta name="theme-color" content="#000000">
</head>
<body>
  <!-- Header -->
  <header class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="#home">🎬 Movie Hub</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#home">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#search">Search</a></li>
          <li class="nav-item"><a class="nav-link" href="#watchlist">Watchlist</a></li>
        </ul>
        <button id="darkModeToggle" class="btn btn-outline-light ms-2" aria-label="Switch to dark mode">🌙</button>
      </div>
    </div>
  </header>

  <!-- Search Input (Global) -->
  <div class="search-bar pt-5 pb-3">
    <div class="container">
      <input type="text" id="searchInput" class="form-control" placeholder="Search movies or TV shows..." aria-label="Search">
    </div>
  </div>

  <!-- Main Content -->
  <main id="mainContent">
    <!-- Home Section -->
    <section id="home" class="container py-4 hidden">
      <h1 class="mb-4">Discover Trending Movies</h1>
      <div id="genreButtons" class="mb-4"></div>
      <div id="trendingGrid" class="row g-3"></div>
    </section>

    <!-- Search Results Section -->
    <section id="searchResults" class="container py-4 hidden">
      <h2 id="resultsTitle">Search Results</h2>
      <div id="resultsGrid" class="row g-3"></div>
    </section>

    <!-- Watchlist Section -->
    <section id="watchlist" class="container py-4 hidden">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>My Watchlist</h2>
        <button id="exportWatchlist" class="btn btn-primary">Export Watchlist</button>
      </div>
      <div id="watchlistGrid" class="row g-3"></div>
    </section>
  </main>

  <!-- Loading Spinner -->
  <div id="loadingSpinner" class="loading-spinner hidden">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- Error Section -->
  <div id="errorSection" class="error-section hidden container py-4 text-center">
    <h3>Oops! Something went wrong.</h3>
    <p id="errorMessage">An error occurred. Please try again.</p>
    <button id="retryButton" class="btn btn-primary">Retry</button>
  </div>

  <!-- Details Modal -->
  <div class="modal fade" id="detailsModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Movie Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="modalBody">
          <!-- Dynamic content loaded here -->
        </div>
        <div class="modal-footer">
          <button id="addToWatchlistBtn" class="btn btn-primary">Add to Watchlist</button>
          <button id="trailerBtn" class="btn btn-secondary">Watch Trailer</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- App JS -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
